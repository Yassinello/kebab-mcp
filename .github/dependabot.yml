version: 2
updates:
  # CI-04 (2026-11 audit): a single npm entry for "/". Dependabot rejects two
  # entries with the same ecosystem + directory, so the former
  # security/version split is expressed with groups instead:
  #   - security updates are grouped separately (`applies-to:
  #     security-updates`) and are not subject to the weekly schedule — an
  #     urgent CVE fix is never blocked behind queued minor bumps;
  #   - version updates are grouped into prod / dev minor+patch PRs. Majors
  #     stay as individual PRs so each breaking change is reviewed on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  # Keeps the digest-pinned base image in the Dockerfile current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies

  # Keeps the SHA-pinned actions in .github/workflows current (Dependabot
  # updates both the SHA and the `# vX.Y.Z` comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
