name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never run two release-please jobs concurrently on main (they would race on
# the release PR); queue instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Write scopes only where needed: release-please pushes the release
    # branch/tag and opens/updates the release PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Locked to v0.1.x patch-only bumps. To advance the minor (0.2,
          # 0.3, ...) edit .release-please-manifest.json directly and merge
          # the change with a `chore: bump minor` commit; release-please
          # will pick up the new base version on the next run.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
