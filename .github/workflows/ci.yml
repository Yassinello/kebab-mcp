name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only reads the repo. Third-party actions are
# pinned to full commit SHAs (tag in the trailing comment); Dependabot's
# github-actions ecosystem keeps them current.
permissions:
  contents: read

# Cancel superseded runs on the same PR; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI-03 (2026-11 audit): test on the maintenance LTS (22) and the active
    # LTS (24). Node 20 reached EOL in April 2026 and the OTel 0.301 cluster
    # requires >=22.15; package.json `engines` enforces the same floor.
    # `fail-fast: false` so a per-version failure still produces the other
    # job's log for triage.
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # --include=optional: the native binaries (lightningcss, @next/swc,
      # tailwind oxide) are platform optionalDependencies of their parents.
      # The stale top-level linux-x64 pins were removed in 2026-11 after the
      # lockfile was regenerated on Linux; the flag is kept as a guard in
      # case an npm config (e.g. omit=optional) would otherwise skip them.
      - run: npm ci --include=optional
      # SCM-03 (v0.11 Phase 44): audit gate policy. FAIL on direct-dep
      # moderate+ (unless allowlisted in scripts/audit-gate.mjs with
      # reason + reviewBy), FAIL on any high/critical, WARN on
      # transitive-dep moderate. Supersedes the earlier SUPPLY-02
      # `npm audit --audit-level=high` gate.
      - name: audit gate (scripted policy)
        run: node scripts/audit-gate.mjs
      - run: npm run lint
      - run: npm run format:check
      # DX-A-02 (v0.16 Phase 66): TypeScript strictness gate. tsc was
      # implicit via `next build`; running tsc --noEmit explicitly
      # catches type regressions ~2 commits earlier and gives a much
      # smaller diagnostic surface than waiting for build to fail.
      - run: npm run typecheck
      # CI-03 (v0.11 Phase 43): knip now blocks on new dead code. The
      # one-time cleanup in `chore(knip):` b1fb3d1 landed before this
      # flip so the main branch is green.
      - name: Dead code check (knip)
        run: npm run lint:unused
      - run: npm run build
      # PERF-05 (v0.11 Phase 43): bundle-size gate. Reads
      # `.next/diagnostics/route-bundle-stats.json` + `config/size-limit.json`
      # and fails if any watched route exceeds its committed budget.
      # Runs immediately after build so regressions surface early.
      - name: Bundle size check (size-limit)
        run: npm run size:check
      # Coverage thresholds (statements/branches/functions/lines) are
      # enforced by vitest — see `coverage.thresholds` in vitest.config.ts
      # (src/ + app/ + proxy.ts, floor(measured) - 1 ratchet).
      - run: npm run test:coverage
      # CI-06 (2026-11 audit): jsdom render/component suite (tests/ui,
      # tests/components) — separate forked-pool config, previously never
      # run in CI.
      - run: npm run test:ui
      - run: npm run test:registry
      - run: npm run test:contract
      # Integration test — starts a real Next.js server and hits health + MCP endpoints.
      # Requires the build step above to have completed (needs .next/ output).
      - name: Integration test
        run: npm run test:integration
        env:
          MCP_AUTH_TOKEN: test-token-ci
          # SEC-A-03 (v0.16 Phase 64): in production, admin auth refuses to
          # fall back to MCP_AUTH_TOKEN unless the operator opts in. The
          # integration test reuses the same token for both surfaces, which
          # is fine for CI but blocked in prod by default — opt in here so
          # the deep-health endpoint stays reachable with the bearer token.
          KEBAB_ADMIN_TOKEN_FALLBACK: "1"
